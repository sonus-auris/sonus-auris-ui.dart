# Headless Android emulator permission test as a Kubernetes Job.
#
# This file is a template. Render it with scripts/emulator/render-k8s-job.sh and
# the exact GHCR digest emitted by .github/workflows/build-emulator-image.yml.
# Mutable tags are intentionally rejected.
#
# The emulator requires hardware virtualization (/dev/kvm), which is available
# only on KVM-capable nodes such as AWS metal instances or dedicated/root
# servers. Label such a node `sonus-auris.dev/kvm=true` and expose KVM through a
# device plugin. The commented privileged hostPath fallback remains an explicit
# operator decision and is not enabled by CI.
apiVersion: batch/v1
kind: Job
metadata:
  name: sonus-emulator-permission-test
  namespace: sonus-auris
  labels:
    app.kubernetes.io/name: sonus-emulator-permission-test
    app.kubernetes.io/part-of: sonus-auris
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonus-emulator-permission-test
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      nodeSelector:
        sonus-auris.dev/kvm: "true"
      containers:
        - name: emulator
          image: ${SONUS_ANDROID_EMULATOR_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: SMOKE_SCREENSHOT
              value: /work/permission-smoke.png
          resources:
            requests:
              cpu: "4"
              memory: 6Gi
            limits:
              devices.kubevirt.io/kvm: "1"
              cpu: "6"
              memory: 8Gi
          # Privileged fallback when no KVM device plugin is installed:
          # securityContext:
          #   privileged: true
          # volumeMounts:
          #   - name: kvm
          #     mountPath: /dev/kvm
      # volumes:
      #   - name: kvm
      #     hostPath:
      #       path: /dev/kvm
      #       type: CharDevice
