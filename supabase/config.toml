project_id = "sonus-auris-auth-e2e"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 10
max_client_conn = 50

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8130"
additional_redirect_urls = ["http://127.0.0.1:8130"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 500
sms_sent = 500
anonymous_users = 30
token_refresh = 500
sign_in_sign_ups = 500
token_verifications = 500
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Sonus Auris test code: {{ `{{ .Code }}` }}"
max_frequency = "1s"

# Supabase Auth skips SMS delivery only for this exact local test number. The
# map is excluded from every hosted/production configuration by construction.
[auth.sms.test_otp]
15005550006 = "424242"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = true
verify_enabled = true
otp_length = 6
template = "Sonus Auris test code: {{ `{{ .Code }}` }}"
max_frequency = "1s"

# Current GoTrue phone-MFA challenges do not use auth.sms.test_otp. The signed
# local hook captures the random provider OTP so shared-auth's compile-time test
# route can complete a real mfa/phone verification without delivering an SMS.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:5120/auth/test/supabase/sms-hook"
secrets = "env(SONUS_TEST_SMS_HOOK_SECRET)"

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 55327
