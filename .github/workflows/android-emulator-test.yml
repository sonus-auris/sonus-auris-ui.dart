name: Android emulator account, lifecycle, and recording tests

# Boots hardware-accelerated Android emulators and exercises:
# - onboarding/account UI and opt-in permission defaults
# - permission grants, force-stop/cold relaunch, and in-place APK reinstall
# - real device-mic -> WAV capture, one-second segment rotation, and restart
# - a host-driven Home transition while the microphone foreground service is live
#
# The same scripts can run locally or on KVM-capable cluster nodes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-permission-test:
    name: Permission/lifecycle smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # API 34 matches the current physical acceptance phone generation;
        # API 36 exercises the app's pinned target/compile SDK contract.
        api-level: [34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=SONUS_SUPABASE_URL=https://emulator-test.supabase.co
          --dart-define=SONUS_SUPABASE_ANON_KEY=sb_publishable_emulator_test

      - name: Run permission/lifecycle smoke-test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # Single line: android-emulator-runner feeds `script` to `sh -c`
          # line-by-line, so a trailing-backslash continuation breaks it.
          script: SMOKE_SCREENSHOT="$PWD/permission-smoke-api-${{ matrix.api-level }}.png" SMOKE_EVIDENCE_DIR="$PWD/permission-smoke-evidence-api-${{ matrix.api-level }}" bash scripts/emulator/permission-smoke.sh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload permission/lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: permission-smoke-evidence-api-${{ matrix.api-level }}
          path: |
            permission-smoke-api-${{ matrix.api-level }}.png
            permission-smoke-evidence-api-${{ matrix.api-level }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Package API-34-tested direct-install debug APK
        if: ${{ matrix.api-level == 34 }}
        run: |
          install -D -m 0644 \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/android-debug-install/sonus-auris-debug.apk
          cd build/android-debug-install
          sha256sum sonus-auris-debug.apk > SHA256SUMS

      - name: Upload API-34-tested direct-install debug APK
        if: ${{ matrix.api-level == 34 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonus-auris-android-debug-apk
          path: build/android-debug-install/**
          if-no-files-found: error
          retention-days: 14

  # Functional end-to-end: real mic stream, WAV files, rapid rotations, recorder
  # restart, and an actual Home/background/foreground round trip.
  recording-integration-test:
    runs-on: ubuntu-latest
    # Hard cap so a stuck emulator/mic can never hang the job for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - run: flutter pub get

      # Build the integration entrypoint once. The harness pre-installs this
      # exact APK, verifies RECORD_AUDIO, then asks flutter drive to reuse it.
      - name: Build recording integration APK
        run: >-
          flutter build apk --debug
          --target=integration_test/recording_pipeline_test.dart

      - name: Run recording/background integration tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          # This always-compiled QEMU driver uses the virtual clock to emit
          # zeroed PCM input frames. It gives AudioRecord deterministic silence
          # while exercising the real guest mic/plugin/WAV pipeline.
          QEMU_AUDIO_DRV: none
          SONUS_BACKGROUND_PROBE: '1'
          BACKGROUND_EVIDENCE_DIR: ${{ github.workspace }}/background-recording-evidence
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # Android Emulator disables host microphone input by default. Explicitly
          # enable the guest capture path; the timer-backed QEMU driver above
          # supplies its deterministic input without physical runner hardware.
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -allow-host-audio
          disable-animations: true
          # The harness pre-installs the test APK, verifies RECORD_AUDIO, and
          # coordinates the real Home/background probe from the host.
          script: >-
            adb emu avd hostmicon &&
            bash scripts/emulator/grant-then-run-integration.sh
            integration_test/recording_pipeline_test.dart

      - name: Upload background recording evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: background-recording-evidence
          path: background-recording-evidence/**
          if-no-files-found: error
          retention-days: 14
