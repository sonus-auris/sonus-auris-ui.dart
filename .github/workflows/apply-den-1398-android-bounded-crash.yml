name: Apply DEN-1398 Android bounded crash evidence

on:
  pull_request:
    paths:
      - '.github/workflows/apply-den-1398-android-bounded-crash.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Apply reviewed bounded-crash transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          probe = Path('scripts/device-lab/android-recording-probe.sh')
          probe_text = probe.read_text(encoding='utf-8')
          if 'bounded-log.py" --max-bytes 524288' not in probe_text:
              expected = '79c16ef35e9f534e90d2d15bf6ae22c7d9e44943'
              observed = subprocess.check_output(
                  ['git', 'hash-object', str(probe)], text=True
              ).strip()
              if observed != expected:
                  raise SystemExit(
                      f'refusing drifted recording probe: expected {expected}, observed {observed}'
                  )

              lines = probe_text.splitlines(keepends=True)
              matches = []
              for index in range(len(lines) - 2):
                  if (
                      lines[index].strip() == 'recent_logcat |'
                      and lines[index + 1].strip()
                      == 'grep -E "$LAB_PKG|FATAL EXCEPTION|AndroidRuntime|am_crash" |'
                      and lines[index + 2].strip()
                      == 'tail -n 160 > "$EVIDENCE_DIR/crash-focused-logcat.txt" || true'
                  ):
                      matches.append(index)
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one final-only crash-log block, found {len(matches)}'
                  )
              index = matches[0]
              indent = lines[index][:-len(lines[index].lstrip())]
              continuation = chr(92)
              lines[index:index + 3] = [
                  f'{indent}recent_logcat |\n',
                  f'{indent}  grep -E "$LAB_PKG|FATAL EXCEPTION|AndroidRuntime|am_crash" |\n',
                  f'{indent}  python3 "$ROOT/scripts/device-lab/bounded-log.py" '
                  f'--max-bytes 524288 {continuation}\n',
                  f'{indent}  > "$EVIDENCE_DIR/crash-focused-logcat.txt" || true\n',
              ]
              probe.write_text(''.join(lines), encoding='utf-8')

          contract = Path('tests/ci/android-device-lab-recording.test.sh')
          contract_text = contract.read_text(encoding='utf-8')
          if 'bounded-memory crash evidence' not in contract_text:
              expected = 'cf932f8495770e0fd86fa0e7b80c01ab2fa6dc61'
              observed = subprocess.check_output(
                  ['git', 'hash-object', str(contract)], text=True
              ).strip()
              if observed != expected:
                  raise SystemExit(
                      f'refusing drifted recording contract: expected {expected}, observed {observed}'
                  )
              contract_text = contract_text.replace(
                  'ORCHESTRATOR="$ROOT/scripts/device-lab/macos-end-device-smoke.sh"\n',
                  'ORCHESTRATOR="$ROOT/scripts/device-lab/macos-end-device-smoke.sh"\n'
                  'BOUNDED_LOG="$ROOT/scripts/device-lab/bounded-log.py"\n',
                  1,
              )
              contract_text = contract_text.replace(
                  'for file in "$GRADLE" "$MANIFEST" "$TARGET" "$PROBE" "$ORCHESTRATOR"; do\n',
                  'for file in "$GRADLE" "$MANIFEST" "$TARGET" "$PROBE" "$ORCHESTRATOR" "$BOUNDED_LOG"; do\n',
                  1,
              )
              contract_text = contract_text.replace(
                  'bash -n "$PROBE"\n',
                  'bash -n "$PROBE"\n'
                  'python3 -m py_compile "$BOUNDED_LOG"\n'
                  'python3 "$BOUNDED_LOG" --self-test\n',
                  1,
              )
              contract_text = contract_text.replace(
                  "grep -Fq 'production_package_addressed=false' \"$PROBE\"\n",
                  "grep -Fq 'production_package_addressed=false' \"$PROBE\"\n"
                  "grep -Fq 'bounded-log.py\" --max-bytes 524288' \"$PROBE\"\n"
                  "if grep -Fq 'tail -n 160' \"$PROBE\"; then\n"
                  "  echo 'recording crash evidence must preserve startup and terminal context' >&2\n"
                  "  exit 1\n"
                  "fi\n"
                  "# bounded-memory crash evidence\n",
                  1,
              )
              contract.write_text(contract_text, encoding='utf-8')
          PY

          bash -n scripts/device-lab/android-recording-probe.sh
          bash -n tests/ci/android-device-lab-recording.test.sh
          python3 -m py_compile scripts/device-lab/bounded-log.py
          python3 scripts/device-lab/bounded-log.py --self-test
          bash tests/ci/android-device-lab-recording.test.sh

      - name: Commit reviewed device-lab hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/device-lab/android-recording-probe.sh \
            tests/ci/android-device-lab-recording.test.sh
          if git diff --cached --quiet; then
            echo 'Android recording crash evidence is already bounded.'
            exit 0
          fi
          git commit -m 'test: preserve bounded Android crash context'
          git push origin HEAD:${{ github.head_ref }}
