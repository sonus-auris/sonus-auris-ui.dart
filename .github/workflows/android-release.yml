name: Android signed release and Play publication

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Public version name (leave blank to use pubspec.yaml)
        type: string
        required: false
      build_number:
        description: Monotonically increasing Play versionCode (blank uses this workflow run number)
        type: string
        required: false
      publish_to_play:
        description: Upload and commit this build through the Google Play Developer API
        type: boolean
        required: true
        default: false
      play_track:
        description: Target Play track; use internal until physical-device acceptance passes
        type: choice
        required: true
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: Release status in the selected track
        type: choice
        required: true
        default: completed
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: mobile-production-android
  cancel-in-progress: false

jobs:
  android-signed-aab:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: mobile-production
    env:
      SONUS_BACKEND_BASE_URL: ${{ secrets.SONUS_BACKEND_BASE_URL }}
      SONUS_SUPABASE_URL: ${{ secrets.SONUS_SUPABASE_URL }}
      SONUS_SUPABASE_ANON_KEY: ${{ secrets.SONUS_SUPABASE_ANON_KEY }}
      SONUS_BUILD_NAME: ${{ inputs.build_name }}
      SONUS_BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Require production configuration and upload key
        run: |
          missing=()
          for name in SONUS_BACKEND_BASE_URL SONUS_SUPABASE_URL SONUS_SUPABASE_ANON_KEY KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD SONUS_BUILD_NUMBER; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::mobile-production is missing: ${missing[*]}"
            exit 1
          fi
          [[ "$SONUS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::build_number must be a positive integer"
            exit 1
          }

      - name: Require Google Play publisher only when requested
        if: ${{ inputs.publish_to_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]] || {
            echo "::error::mobile-production is missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          }

      - name: Install ephemeral Android upload key
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

      - name: Test release candidate
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build signed Play App Bundle
        run: scripts/release/android-build-aab.sh

      - name: Validate Play publication plan
        run: >-
          python3 scripts/release/publish_google_play.py
          --dry-run
          --package-name com.ores.audio_dashcam
          --aab build/app/outputs/bundle/release/app-release.aab
          --track '${{ inputs.play_track }}'
          --status '${{ inputs.play_status }}'

      - name: Create artifact checksum
        run: |
          cd build/app/outputs/bundle/release
          sha256sum app-release.aab > SHA256SUMS

      - name: Upload signed AAB and symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-auris-android-${{ env.SONUS_BUILD_NUMBER }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/SHA256SUMS
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Install Google Play API dependencies
        if: ${{ inputs.publish_to_play }}
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'google-auth>=2.40,<3' 'requests>=2.32,<3'

      - name: Publish to Google Play
        if: ${{ inputs.publish_to_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 scripts/release/publish_google_play.py
          --package-name com.ores.audio_dashcam
          --aab build/app/outputs/bundle/release/app-release.aab
          --track '${{ inputs.play_track }}'
          --status '${{ inputs.play_status }}'
          --release-name 'Sonus Auris ${{ env.SONUS_BUILD_NAME }}+${{ env.SONUS_BUILD_NUMBER }}'

      - name: Remove ephemeral upload key
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
