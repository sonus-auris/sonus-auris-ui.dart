name: Apply DEN-1398 Android mutation-contract fix

on:
  pull_request:
    paths:
      - '.github/workflows/apply-den-1398-android-mutation-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Scope the mutation to the Android auto branch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/ci/android-device-target-resolution.test.py')
          source = path.read_text(encoding='utf-8')
          old = '''        source.replace('"$selection_status" == "78"', '"$selection_status" != "0"', 1),
          '''
          new = '''        source.replace(
              'elif [[ "$selection_status" == "78" ]]; then\\n'
              '      echo "No authorized physical Android target detected; skipping Android smoke."',
              'elif [[ "$selection_status" != "0" ]]; then\\n'
              '      echo "No authorized physical Android target detected; skipping Android smoke."',
              1,
          ),
          '''
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('expected ambiguous mutation expression was not found')
          if source.count(old) != 1:
              raise SystemExit('expected exactly one ambiguous mutation expression')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile \
            scripts/device-lab/resolve-physical-android.py \
            tests/ci/android-device-target-resolution.test.py
          python3 scripts/device-lab/resolve-physical-android.py --self-test
          python3 tests/ci/android-device-target-resolution.test.py

      - name: Commit the tested contract fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ci/android-device-target-resolution.test.py
          if git diff --cached --quiet; then
            echo 'Android mutation contract is already scoped.'
            exit 0
          fi
          git commit -m 'test: scope Android auto-mode mutation'
          git push origin HEAD:${{ github.head_ref }}
