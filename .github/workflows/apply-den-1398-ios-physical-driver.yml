name: Apply DEN-1398 physical iPhone run driver

on:
  pull_request:
    paths:
      - '.github/workflows/apply-den-1398-ios-physical-driver.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Apply reviewed physical-iPhone driver transformation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('scripts/device-lab/ios-attached-smoke.sh')
          text = path.read_text(encoding='utf-8')
          if 'flutter-run-driver.py' not in text:
              expected = 'ddbed5e5d83d5d7479c111da04241eb1b5920aa7'
              observed = subprocess.check_output(
                  ['git', 'hash-object', str(path)], text=True
              ).strip()
              if observed != expected:
                  raise SystemExit(
                      f'refusing drifted physical-iPhone harness: '
                      f'expected {expected}, observed {observed}'
                  )

              start_marker = (
                  '    python3 - "$EVIDENCE_DIR/$label-flutter-run.txt" '
                  '"$RUN_TIMEOUT_SECONDS" "$READY_HOLD_SECONDS" \\\n'
              )
              start = text.index(start_marker)
              command_start = text.index('      flutter run \\\n', start)
              heredoc = text.index(" <<'PY'\n", command_start)
              end = text.index('\nPY\n', heredoc) + len('\nPY\n')
              command = text[command_start:heredoc].rstrip()
              replacement = (
                  '    python3 "$ROOT/scripts/device-lab/flutter-run-driver.py" \\\n'
                  '      --log "$EVIDENCE_DIR/$label-flutter-run.txt" \\\n'
                  '      --timeout-seconds "$RUN_TIMEOUT_SECONDS" \\\n'
                  '      --hold-seconds "$READY_HOLD_SECONDS" \\\n'
                  '      --max-log-bytes 524288 \\\n'
                  '      -- \\\n'
                  + command
                  + '\n'
              )
              text = text[:start] + replacement + text[end:]
              text = text.replace(
                  'recording_automated=false\n'
                  'launch_cycles_requested=$LAUNCH_CYCLES\n',
                  'recording_automated=false\n'
                  'driver_hold_required=true\n'
                  'premature_exit_rejected=true\n'
                  'retained_log_max_bytes=524288\n'
                  'launch_cycles_requested=$LAUNCH_CYCLES\n',
                  1,
              )
              text = text.replace(
                  'recording_automated=false\n'
                  'launch_cycles_completed=$completed\n',
                  'recording_automated=false\n'
                  'driver_hold_required=true\n'
                  'premature_exit_rejected=true\n'
                  'retained_log_max_bytes=524288\n'
                  'launch_cycles_completed=$completed\n',
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY

          bash -n scripts/device-lab/ios-attached-smoke.sh
          python3 -m py_compile \
            scripts/device-lab/flutter-run-driver.py \
            tests/ci/ios_physical_driver.test.py
          python3 tests/ci/ios_physical_driver.test.py
          grep -Fq 'driver_hold_required=true' scripts/device-lab/ios-attached-smoke.sh
          grep -Fq 'premature_exit_rejected=true' scripts/device-lab/ios-attached-smoke.sh
          grep -Fq 'retained_log_max_bytes=524288' scripts/device-lab/ios-attached-smoke.sh

      - name: Commit reviewed physical-iPhone hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/device-lab/ios-attached-smoke.sh
          if git diff --cached --quiet; then
            echo 'Physical-iPhone run driver is already integrated.'
            exit 0
          fi
          git commit -m 'test: reject premature physical-iPhone exits'
          git push origin HEAD:${{ github.head_ref }}
