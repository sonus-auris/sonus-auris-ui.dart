name: Device-lab script and iOS Simulator smoke

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'macos/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/device-lab/**'
      - 'tests/ci/ios-simulator-log-evidence.test.py'
      - 'tests/ci/ios-physical-device-contract.test.py'
      - 'docs/end-device-testing.md'
      - 'docs/mobile-ci.md'
      - '.github/workflows/device-lab.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'macos/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/device-lab/**'
      - 'tests/ci/ios-simulator-log-evidence.test.py'
      - 'tests/ci/ios-physical-device-contract.test.py'
      - 'docs/end-device-testing.md'
      - 'docs/mobile-ci.md'
      - '.github/workflows/device-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-contract:
    name: Device-lab shell and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Bash, Python, and evidence-policy contracts
        run: |
          set -euo pipefail
          bash -n scripts/device-lab/*.sh
          python3 -m py_compile \
            scripts/device-lab/evidence-policy.py \
            scripts/device-lab/bounded-log-scan.py \
            scripts/device-lab/flutter-run-cycle.py \
            tests/ci/ios-simulator-log-evidence.test.py \
            tests/ci/ios-physical-device-contract.test.py
          python3 scripts/device-lab/evidence-policy.py --self-test
          python3 scripts/device-lab/bounded-log-scan.py --self-test
          python3 scripts/device-lab/flutter-run-cycle.py --self-test
          python3 tests/ci/ios-simulator-log-evidence.test.py
          python3 tests/ci/ios-physical-device-contract.test.py
          grep -Fq '"uuid"' scripts/device-lab/evidence-policy.py
          if grep -Fq 'SKIP_LIVE_LOGS' scripts/device-lab/evidence-policy.py; then
            echo 'All uploaded text logs, including run.log, must pass evidence policy.' >&2
            exit 1
          fi

      - name: Enforce non-destructive physical-device defaults
        run: |
          set -euo pipefail
          android=scripts/device-lab/android-attached-smoke.sh
          ios_device=scripts/device-lab/ios-attached-smoke.sh
          ios_simulator=scripts/device-lab/ios-simulator-smoke.sh
          ios_full_log=scripts/device-lab/ios-simulator-full-log-smoke.sh
          orchestrator=scripts/device-lab/macos-end-device-smoke.sh
          if grep -En 'adb(_)? .*uninstall|pm clear|simctl erase|simctl uninstall|^[[:space:]]*adb(_)?[[:space:]].*logcat[[:space:]]+-c' \
            "$android" "$ios_device" "$ios_simulator" "$ios_full_log"; then
            echo 'Attached-device/simulator scripts may not clear app, device, permission, or shared log data.' >&2
            exit 1
          fi
          grep -Fq 'permissions_mutated=false' "$android"
          grep -Fq 'log_buffer_cleared=false' "$android"
          grep -Fq 'package_state_preserved=' "$android"
          grep -Fq '$(basename "$APK")' "$android"
          grep -Fq 'app_data_cleared=false' "$ios_device"
          grep -Fq 'launch_cycles_completed=' "$ios_device"
          grep -Fq 'terminal_output_drained=true' "$ios_device"
          grep -Fq 'fatal_runtime_markers_checked=true' "$ios_device"
          grep -Fq 'python3 "$CYCLE_MONITOR"' "$ios_device"
          grep -Fq 'python3 "$EVIDENCE_POLICY" --stream' "$ios_device"
          grep -Fq 'selected.get("emulator")' "$ios_device"
          grep -Fq 'The requested Flutter target is an emulator, not a physical iPhone' "$ios_device"
          grep -Fq 'data_container_preserved=true' "$ios_simulator"
          grep -Fq 'preservation_proof=test-owned-sentinel' "$ios_simulator"
          grep -Fq 'test_owned_sentinel_preserved=true' "$ios_simulator"
          grep -Fq 'test_owned_sentinel_removed=true' "$ios_simulator"
          grep -Fq 'existing_app_files_enumerated=false' "$ios_simulator"
          grep -Fq 'process_scoped_logs=true' "$ios_simulator"
          grep -Fq 'full_log_stream_scanned=true' "$ios_full_log"
          grep -Fq 'startup_log_context_preserved=true' "$ios_full_log"
          grep -Fq 'terminal_log_context_preserved=true' "$ios_full_log"
          grep -Fq 'evidence-policy.py" --stream' "$ios_full_log"
          grep -Fq 'bounded-log-scan.py"' "$ios_full_log"
          if grep -Fq 'tail -n 500' "$ios_full_log"; then
            echo 'Full-session simulator evidence may not discard startup log context.' >&2
            exit 1
          fi
          grep -Fq 'evidence-policy.py' "$orchestrator"
          if grep -Fq 'shasum -a 256 "$APK" >' "$android"; then
            echo 'APK checksum evidence may not embed the operator checkout path.' >&2
            exit 1
          fi

      - name: Enforce isolated Flutter desktop runtime
        run: |
          set -euo pipefail
          script=scripts/device-lab/flutter-macos-smoke.sh
          source=lib/src/platform/desktop_autostart.dart
          grep -Fq -- '--dart-define=SONUS_DEVICE_LAB_NO_SIDE_EFFECTS=true' "$script"
          grep -Fq 'RUNTIME_BUNDLE_ID="${PRODUCTION_BUNDLE_ID}.deviceLab"' "$script"
          grep -Fq 'login_item_mutation_suppressed=true' "$script"
          grep -Fq 'recording_automated=false' "$script"
          grep -Fq 'preexisting_app_disturbed=false' "$script"
          grep -Fq "tell application id \\\"\$RUNTIME_BUNDLE_ID\\\" to quit" "$script"
          grep -Fq "const bool kSonusDeviceLabNoSideEffects" "$source"
          grep -Fq "if (!isSupported || kSonusDeviceLabNoSideEffects) return;" "$source"
          if grep -En 'rm -|rm$|find .* -delete|simctl erase|pm clear|adb(_)? .*uninstall' scripts/device-lab/*.sh; then
            echo 'Device-lab scripts may not delete app, recording, permission, or device data.' >&2
            exit 1
          fi

  ios-simulator:
    name: iOS Simulator install/update/relaunch + full-log smoke
    needs: script-contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Toolchain evidence
        run: |
          flutter --version
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Validate device-lab Dart formatting
        run: |
          set -euo pipefail
          dart format lib/src/platform/desktop_autostart.dart
          if ! git diff --exit-code -- lib/src/platform/desktop_autostart.dart; then
            echo 'Device-lab Dart source is not formatted; exact formatter delta follows.' >&2
            git diff -- lib/src/platform/desktop_autostart.dart
            exit 1
          fi

      - name: Run non-destructive iOS Simulator lifecycle and full-log smoke
        env:
          SONUS_DEVICE_LAB_DIR: ${{ runner.temp }}/sonus-ios-simulator-evidence
          SONUS_CAPTURE_SCREENSHOT: '1'
          SONUS_DEVICE_LAB_MAX_LOG_BYTES: '524288'
        run: bash scripts/device-lab/ios-simulator-full-log-smoke.sh

      - name: Redact and verify simulator evidence
        id: evidence_policy
        if: always()
        env:
          SONUS_DEVICE_LAB_DIR: ${{ runner.temp }}/sonus-ios-simulator-evidence
        run: python3 scripts/device-lab/evidence-policy.py --redact "$SONUS_DEVICE_LAB_DIR"

      - name: Upload sanitized simulator evidence
        if: ${{ always() && steps.evidence_policy.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-ios-simulator-evidence
          path: ${{ runner.temp }}/sonus-ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 7
