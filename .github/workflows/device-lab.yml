name: Device-lab scripts, iOS Simulator, and isolated Android probes

on:
  pull_request:
    paths:
      - 'android/**'
      - 'integration_test/device_lab_permission_denied_test.dart'
      - 'integration_test/device_lab_recording_probe_test.dart'
      - 'lib/**'
      - 'ios/**'
      - 'macos/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/device-lab/**'
      - 'tests/ci/android-device-lab-recording.test.sh'
      - 'tests/ci/android-permission-denial.test.sh'
      - 'docs/android-permission-denial-device-lab.md'
      - 'docs/android-recording-device-lab.md'
      - 'docs/end-device-testing.md'
      - 'docs/mobile-ci.md'
      - '.github/workflows/device-lab.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'integration_test/device_lab_permission_denied_test.dart'
      - 'integration_test/device_lab_recording_probe_test.dart'
      - 'lib/**'
      - 'ios/**'
      - 'macos/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/device-lab/**'
      - 'tests/ci/android-device-lab-recording.test.sh'
      - 'tests/ci/android-permission-denial.test.sh'
      - 'docs/android-permission-denial-device-lab.md'
      - 'docs/android-recording-device-lab.md'
      - 'docs/end-device-testing.md'
      - 'docs/mobile-ci.md'
      - '.github/workflows/device-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

# Emulator and simulator jobs are expensive and produce diagnostic evidence.
# Give every exact commit its own group: concurrent writers neither cancel an
# in-flight run nor leave the newest device evidence behind stale queued heads.
concurrency:
  group: device-lab-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  script-contract:
    name: Device-lab shell and evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Bash, Python, and evidence-policy contracts
        run: |
          set -euo pipefail
          bash -n scripts/device-lab/*.sh
          bash -n tests/ci/android-device-lab-recording.test.sh
          bash -n tests/ci/android-permission-denial.test.sh
          bash tests/ci/android-device-lab-recording.test.sh
          bash tests/ci/android-permission-denial.test.sh
          python3 -m py_compile scripts/device-lab/evidence-policy.py
          python3 scripts/device-lab/evidence-policy.py --self-test
          grep -Fq '"uuid"' scripts/device-lab/evidence-policy.py
          if grep -Fq 'SKIP_LIVE_LOGS' scripts/device-lab/evidence-policy.py; then
            echo 'All uploaded text logs, including run.log, must pass evidence policy.' >&2
            exit 1
          fi

      - name: Enforce non-destructive physical-device defaults
        run: |
          set -euo pipefail
          android=scripts/device-lab/android-attached-smoke.sh
          android_permission=scripts/device-lab/android-permission-denial-probe.sh
          android_recording=scripts/device-lab/android-recording-probe.sh
          ios_device=scripts/device-lab/ios-attached-smoke.sh
          ios_simulator=scripts/device-lab/ios-simulator-smoke.sh
          orchestrator=scripts/device-lab/macos-end-device-smoke.sh
          if grep -En 'adb(_)? .*uninstall|pm[[:space:]]+clear([[:space:]]|$)|simctl erase|simctl uninstall|^[[:space:]]*adb(_)?[[:space:]].*logcat[[:space:]]+-c' \
            "$android" "$android_permission" "$android_recording" "$ios_device" "$ios_simulator"; then
            echo 'Attached-device/simulator scripts may not uninstall, clear app/device data, or clear shared logs.' >&2
            exit 1
          fi
          grep -Fq 'permissions_mutated=false' "$android"
          grep -Fq 'log_buffer_cleared=false' "$android"
          grep -Fq 'package_state_preserved=' "$android"
          grep -Fq '$(basename "$APK")' "$android"
          grep -Fq 'production_package_addressed=false' "$android_permission"
          grep -Fq 'recording_lab_package_addressed=false' "$android_permission"
          grep -Fq 'probe_audio_artifacts=0' "$android_permission"
          grep -Fq 'I_CONSENT_TO_A_15_SECOND_SONUS_DEVICE_LAB_RECORDING' "$android_recording"
          grep -Fq 'production_package_addressed=false' "$android_recording"
          grep -Fq 'raw_audio_exported=false' "$android_recording"
          grep -Fq 'shared_logcat_cleared=false' "$android_recording"
          grep -Fq 'app_data_cleared=false' "$ios_device"
          grep -Fq 'launch_cycles_completed=' "$ios_device"
          grep -Fq 'selected.get("emulator")' "$ios_device"
          grep -Fq 'The requested Flutter target is an emulator, not a physical iPhone' "$ios_device"
          grep -Fq 'data_container_preserved=true' "$ios_simulator"
          grep -Fq 'preservation_proof=test-owned-sentinel' "$ios_simulator"
          grep -Fq 'test_owned_sentinel_preserved=true' "$ios_simulator"
          grep -Fq 'test_owned_sentinel_removed=true' "$ios_simulator"
          grep -Fq 'existing_app_files_enumerated=false' "$ios_simulator"
          grep -Fq 'process_scoped_logs=true' "$ios_simulator"
          grep -Fq 'evidence-policy.py' "$orchestrator"
          grep -Fq 'SONUS_RUN_ANDROID_PERMISSION_DENIAL_PROBE' "$orchestrator"
          grep -Fq 'SONUS_RUN_ANDROID_RECORDING_PROBE' "$orchestrator"
          if grep -Fq 'shasum -a 256 "$APK" >' "$android"; then
            echo 'APK checksum evidence may not embed the operator checkout path.' >&2
            exit 1
          fi

      - name: Enforce isolated Flutter desktop runtime
        run: |
          set -euo pipefail
          script=scripts/device-lab/flutter-macos-smoke.sh
          source=lib/src/platform/desktop_autostart.dart
          grep -Fq -- '--dart-define=SONUS_DEVICE_LAB_NO_SIDE_EFFECTS=true' "$script"
          grep -Fq 'RUNTIME_BUNDLE_ID="${PRODUCTION_BUNDLE_ID}.deviceLab"' "$script"
          grep -Fq 'login_item_mutation_suppressed=true' "$script"
          grep -Fq 'recording_automated=false' "$script"
          grep -Fq 'preexisting_app_disturbed=false' "$script"
          grep -Fq "tell application id \\\"\$RUNTIME_BUNDLE_ID\\\" to quit" "$script"
          grep -Fq "const bool kSonusDeviceLabNoSideEffects" "$source"
          grep -Fq "if (!isSupported || kSonusDeviceLabNoSideEffects) return;" "$source"
          if grep -En 'rm -|rm$|find .* -delete|simctl erase|pm[[:space:]]+clear([[:space:]]|$)|adb(_)? .*uninstall' scripts/device-lab/*.sh; then
            echo 'Device-lab scripts may not delete app, recording, or device data.' >&2
            exit 1
          fi

  ios-simulator:
    name: iOS Simulator install/update/relaunch smoke
    needs: script-contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Toolchain evidence
        run: |
          flutter --version
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Validate device-lab Dart formatting
        run: |
          set -euo pipefail
          dart format \
            integration_test/device_lab_permission_denied_test.dart \
            integration_test/device_lab_recording_probe_test.dart \
            lib/src/platform/desktop_autostart.dart
          if ! git diff --exit-code -- \
            integration_test/device_lab_permission_denied_test.dart \
            integration_test/device_lab_recording_probe_test.dart \
            lib/src/platform/desktop_autostart.dart; then
            echo 'Device-lab Dart source is not formatted; exact formatter delta follows.' >&2
            git diff -- \
              integration_test/device_lab_permission_denied_test.dart \
              integration_test/device_lab_recording_probe_test.dart \
              lib/src/platform/desktop_autostart.dart
            exit 1
          fi

      - name: Run non-destructive iOS Simulator smoke
        env:
          SONUS_DEVICE_LAB_DIR: ${{ runner.temp }}/sonus-ios-simulator-evidence
          SONUS_CAPTURE_SCREENSHOT: '1'
        run: bash scripts/device-lab/ios-simulator-smoke.sh

      - name: Redact and verify simulator evidence
        id: evidence_policy
        if: always()
        env:
          SONUS_DEVICE_LAB_DIR: ${{ runner.temp }}/sonus-ios-simulator-evidence
        run: |
          mkdir -p "$SONUS_DEVICE_LAB_DIR"
          python3 scripts/device-lab/evidence-policy.py --redact "$SONUS_DEVICE_LAB_DIR"

      - name: Upload sanitized simulator evidence
        if: ${{ always() && steps.evidence_policy.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-ios-simulator-evidence
          path: ${{ runner.temp }}/sonus-ios-simulator-evidence
          if-no-files-found: warn
          retention-days: 7

  android-isolated-probes:
    name: Isolated Android denial and recording probes (API 34)
    needs: script-contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Run denial then recording probe on one KVM emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          QEMU_AUDIO_DRV: none
          SONUS_ALLOW_ANDROID_EMULATOR: '1'
          SONUS_ANDROID_RECORDING_PROBE_CONSENT: I_CONSENT_TO_A_15_SECOND_SONUS_DEVICE_LAB_RECORDING
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect -allow-host-audio
          disable-animations: true
          script: |
            set +e
            SONUS_DEVICE_LAB_DIR="$GITHUB_WORKSPACE/isolated-android-permission-evidence" \
              bash scripts/device-lab/android-permission-denial-probe.sh
            permission_status=$?
            adb emu avd hostmicon
            SONUS_DEVICE_LAB_DIR="$GITHUB_WORKSPACE/isolated-android-recording-evidence" \
              bash scripts/device-lab/android-recording-probe.sh
            recording_status=$?
            if [[ "$permission_status" != "0" ]]; then
              echo "Permission-denial probe failed with status $permission_status" >&2
              exit "$permission_status"
            fi
            if [[ "$recording_status" != "0" ]]; then
              echo "Recording probe failed with status $recording_status" >&2
              exit "$recording_status"
            fi

      - name: Redact and verify permission-denial evidence
        id: permission_evidence_policy
        if: always()
        env:
          SONUS_DEVICE_LAB_DIR: ${{ github.workspace }}/isolated-android-permission-evidence
        run: |
          mkdir -p "$SONUS_DEVICE_LAB_DIR"
          python3 scripts/device-lab/evidence-policy.py --redact "$SONUS_DEVICE_LAB_DIR"

      - name: Redact and verify recording evidence
        id: recording_evidence_policy
        if: always()
        env:
          SONUS_DEVICE_LAB_DIR: ${{ github.workspace }}/isolated-android-recording-evidence
        run: |
          mkdir -p "$SONUS_DEVICE_LAB_DIR"
          python3 scripts/device-lab/evidence-policy.py --redact "$SONUS_DEVICE_LAB_DIR"

      - name: Upload sanitized permission-denial evidence
        if: ${{ always() && steps.permission_evidence_policy.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-isolated-android-permission-denial-evidence
          path: isolated-android-permission-evidence/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload sanitized recording evidence
        if: ${{ always() && steps.recording_evidence_policy.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-isolated-android-recording-evidence
          path: isolated-android-recording-evidence/**
          if-no-files-found: error
          retention-days: 7
