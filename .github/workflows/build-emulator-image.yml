name: Build Android emulator image

# Builds ci/android-emulator/Dockerfile on a real amd64 runner and pushes it to
# GHCR so the cluster (Hetzner/EC2 amd64 nodes) can pull it for the permission
# test Job. This proves the Dockerfile (SDK install + AVD creation) works, and
# produces the exact image referenced by
# ci/android-emulator/k8s/emulator-permission-test.job.yaml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ci/android-emulator/**
      - scripts/emulator/**
      - .github/workflows/build-emulator-image.yml
  pull_request:
    paths:
      - ci/android-emulator/**
      - scripts/emulator/**
      - .github/workflows/build-emulator-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Pull requests build the Dockerfile to prove it still works, but must not
      # publish: the :latest tag is consumed by the production k8s permission-test
      # Job, and a PR branch is unreviewed code. Only main/dispatch publishes.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/android-emulator/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/android-emulator:latest
            ghcr.io/${{ github.repository_owner }}/android-emulator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
