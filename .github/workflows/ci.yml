name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build production web console
        run: flutter build web --release

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install locked browser harness
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: e2e
        run: npm run browsers
      - name: Boot the real Flutter build in Puppeteer and Playwright
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: console-web-and-browser-evidence-${{ github.run_attempt }}
          path: |
            build/web
            e2e/artifacts/*.png
          if-no-files-found: error
          retention-days: 14
