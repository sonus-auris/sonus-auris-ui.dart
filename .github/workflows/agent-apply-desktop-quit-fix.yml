name: Apply Flutter desktop quit fix

on:
  push:
    branches:
      - agent/flutter-desktop-quit-branding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/flutter-desktop-quit-branding
          persist-credentials: true

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          main_path = "lib/main_desktop.dart"
          replace_once(
              main_path,
              """//     every device's audio with the account private key — see MULTI_DEVICE.md;\n//     the pure-Rust `desktop.app.rs` owns that role too).\n""",
              """//     every device's audio with the account private key — see MULTI_DEVICE.md).\n""",
          )
          replace_once(
              main_path,
              """import 'src/platform/desktop_autostart.dart';\n""",
              """import 'src/platform/desktop_autostart.dart';\nimport 'src/platform/desktop_shutdown.dart';\n""",
          )
          replace_once(
              main_path,
              """  bool _trayReady = false;\n  bool _quitting = false;\n""",
              """  bool _trayReady = false;\n  bool _quitting = false;\n  final DesktopShutdownCoordinator _shutdown =\n      const DesktopShutdownCoordinator();\n""",
          )
          replace_once(
              main_path,
              """  Future<void> _quitDesktopApp() async {\n    if (_quitting) return;\n    _quitting = true;\n    await windowManager.setPreventClose(false);\n    await trayManager.destroy();\n    await _disposeController();\n    await windowManager.destroy();\n  }\n""",
              """  Future<void> _quitDesktopApp() async {\n    if (_quitting) return;\n    _quitting = true;\n    // Stop receiving close/tray callbacks while shutdown is in progress. The\n    // coordinator bounds every asynchronous cleanup step and always terminates\n    // the process, so a stuck recorder/plugin cannot leave a zombie menu-bar app.\n    windowManager.removeListener(this);\n    trayManager.removeListener(this);\n    await _shutdown.shutdown(\n      allowClose: () => windowManager.setPreventClose(false),\n      destroyTray: trayManager.destroy,\n      disposeController: _disposeController,\n      destroyWindow: windowManager.destroy,\n      terminateProcess: exit,\n    );\n  }\n""",
          )

          Path("lib/src/platform/desktop_shutdown.dart").write_text("""import 'dart:async';\n\ntypedef DesktopShutdownStep = Future<void> Function();\n\n/// Runs desktop shutdown as a bounded, best-effort sequence.\n///\n/// Explicit Quit must always terminate the process. Recorder, tray, and native\n/// window plugins still receive a grace period to flush/close cleanly, but none\n/// can keep Sonus Auris alive forever.\nclass DesktopShutdownCoordinator {\n  const DesktopShutdownCoordinator({\n    this.platformStepTimeout = const Duration(seconds: 1),\n    this.controllerTimeout = const Duration(seconds: 3),\n  });\n\n  final Duration platformStepTimeout;\n  final Duration controllerTimeout;\n\n  Future<void> shutdown({\n    required DesktopShutdownStep allowClose,\n    required DesktopShutdownStep destroyTray,\n    required DesktopShutdownStep disposeController,\n    required DesktopShutdownStep destroyWindow,\n    required void Function(int code) terminateProcess,\n  }) async {\n    await _bestEffort(allowClose, platformStepTimeout);\n    await _bestEffort(destroyTray, platformStepTimeout);\n    await _bestEffort(disposeController, controllerTimeout);\n    await _bestEffort(destroyWindow, platformStepTimeout);\n    terminateProcess(0);\n  }\n\n  static Future<void> _bestEffort(\n    DesktopShutdownStep step,\n    Duration timeout,\n  ) async {\n    try {\n      await step().timeout(timeout);\n    } catch (_) {\n      // Explicit Quit is fail-open: later cleanup and process termination must\n      // continue even if one plugin throws or never completes.\n    }\n  }\n}\n""")

          Path("test/desktop_shutdown_test.dart").write_text("""import 'dart:async';\n\nimport 'package:audio_dashcam/src/platform/desktop_shutdown.dart';\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('quit continues after failed and timed-out cleanup steps', () async {\n    final calls = <String>[];\n    final never = Completer<void>();\n    int? exitCode;\n\n    const coordinator = DesktopShutdownCoordinator(\n      platformStepTimeout: Duration(milliseconds: 20),\n      controllerTimeout: Duration(milliseconds: 20),\n    );\n\n    await coordinator.shutdown(\n      allowClose: () async {\n        calls.add('allow-close');\n        throw StateError('native close failed');\n      },\n      destroyTray: () {\n        calls.add('destroy-tray');\n        return never.future;\n      },\n      disposeController: () async {\n        calls.add('dispose-controller');\n      },\n      destroyWindow: () async {\n        calls.add('destroy-window');\n      },\n      terminateProcess: (code) {\n        calls.add('exit');\n        exitCode = code;\n      },\n    );\n\n    expect(calls, <String>[\n      'allow-close',\n      'destroy-tray',\n      'dispose-controller',\n      'destroy-window',\n      'exit',\n    ]);\n    expect(exitCode, 0);\n  });\n\n  test('controller disposal gets its own bounded grace period', () async {\n    final never = Completer<void>();\n    var windowDestroyed = false;\n    var exited = false;\n\n    const coordinator = DesktopShutdownCoordinator(\n      platformStepTimeout: Duration(milliseconds: 10),\n      controllerTimeout: Duration(milliseconds: 25),\n    );\n\n    await coordinator.shutdown(\n      allowClose: () async {},\n      destroyTray: () async {},\n      disposeController: () => never.future,\n      destroyWindow: () async {\n        windowDestroyed = true;\n      },\n      terminateProcess: (_) {\n        exited = true;\n      },\n    );\n\n    expect(windowDestroyed, isTrue);\n    expect(exited, isTrue);\n  });\n}\n""")

          Path("lib/src/platform/desktop_autostart.dart").write_text("""// Registers the packaged desktop build as a login item (no-op on mobile).\nimport 'dart:io';\n\nimport 'package:flutter/foundation.dart' show kReleaseMode;\nimport 'package:flutter/services.dart';\nimport 'package:launch_at_startup/launch_at_startup.dart';\nimport 'package:shared_preferences/shared_preferences.dart';\n\n/// Registers the installed desktop app as a login item.\n///\n/// macOS release builds use `SMAppService.mainApp`, which launches the signed\n/// Sonus Auris app bundle and preserves its bundle identity for TCC permission\n/// prompts. Debug/profile runs never register themselves at login, preventing a\n/// Terminal/debug executable from becoming the microphone permission owner.\nclass DesktopAutostart {\n  static const _configuredKey = 'desktop.autostart.configured.v1';\n  static const _macChannel = MethodChannel(\n    'sonus_auris/desktop_autostart',\n  );\n\n  static bool get isSupported =>\n      Platform.isMacOS || Platform.isWindows || Platform.isLinux;\n\n  static bool get canConfigure =>\n      isSupported && (!Platform.isMacOS || kReleaseMode);\n\n  /// Wires the cross-platform package on Windows/Linux. macOS uses the native\n  /// ServiceManagement bridge, which needs no executable path.\n  static void setup() {\n    if (!(Platform.isWindows || Platform.isLinux)) return;\n    launchAtStartup.setup(\n      appName: 'Sonus Auris',\n      appPath: Platform.resolvedExecutable,\n    );\n  }\n\n  /// On the first packaged desktop launch, enable launch-at-login by default.\n  /// A persisted marker means we never fight a user who later turns it off.\n  static Future<void> enableByDefaultOnce() async {\n    if (!canConfigure) return;\n    try {\n      final prefs = await SharedPreferences.getInstance();\n      if (prefs.getBool(_configuredKey) ?? false) return;\n      await _setEnabled(true);\n      await prefs.setBool(_configuredKey, true);\n    } catch (_) {\n      // Login-item registration is best-effort; never block app startup.\n    }\n  }\n\n  static Future<bool> isEnabled() async {\n    if (!canConfigure) return false;\n    try {\n      if (Platform.isMacOS) {\n        return await _macChannel.invokeMethod<bool>('isEnabled') ?? false;\n      }\n      return await launchAtStartup.isEnabled();\n    } catch (_) {\n      return false;\n    }\n  }\n\n  static Future<void> setEnabled(bool enabled) async {\n    if (!canConfigure) return;\n    try {\n      await _setEnabled(enabled);\n    } catch (_) {\n      // Best-effort; the UI re-reads the actual platform state.\n    }\n  }\n\n  static Future<void> _setEnabled(bool enabled) async {\n    if (Platform.isMacOS) {\n      await _macChannel.invokeMethod<void>(\n        'setEnabled',\n        <String, Object>{'enabled': enabled},\n      );\n      return;\n    }\n    if (enabled) {\n      await launchAtStartup.enable();\n    } else {\n      await launchAtStartup.disable();\n    }\n  }\n}\n""")

          swift_path = "macos/Runner/MainFlutterWindow.swift"
          replace_once(
              swift_path,
              """import Cocoa\nimport FlutterMacOS\n""",
              """import Cocoa\nimport FlutterMacOS\nimport ServiceManagement\n""",
          )
          replace_once(
              swift_path,
              """    RegisterGeneratedPlugins(registry: flutterViewController)\n    MacIcloudBridge.register(\n""",
              """    RegisterGeneratedPlugins(registry: flutterViewController)\n    MacAutostartBridge.register(\n      messenger: flutterViewController.engine.binaryMessenger\n    )\n    MacIcloudBridge.register(\n""",
          )
          replace_once(
              swift_path,
              """/// macOS side of the same channel used by the iOS iCloud bridge. Files are\n""",
              """/// Registers the packaged main app as the login item on macOS 13+. Using\n/// SMAppService.mainApp keeps launch-at-login tied to the Sonus Auris bundle\n/// instead of a shell/debug executable, so privacy prompts show Sonus Auris.\nprivate enum MacAutostartBridge {\n  private static let channelName = \"sonus_auris/desktop_autostart\"\n\n  static func register(messenger: FlutterBinaryMessenger) {\n    FlutterMethodChannel(\n      name: channelName,\n      binaryMessenger: messenger\n    ).setMethodCallHandler { call, result in\n      switch call.method {\n      case \"isEnabled\":\n        guard #available(macOS 13.0, *) else {\n          result(false)\n          return\n        }\n        let status = SMAppService.mainApp.status\n        result(status == .enabled || status == .requiresApproval)\n      case \"setEnabled\":\n        guard\n          let arguments = call.arguments as? [String: Any],\n          let enabled = arguments[\"enabled\"] as? Bool\n        else {\n          result(FlutterError(\n            code: \"bad_args\",\n            message: \"enabled must be a boolean\",\n            details: nil\n          ))\n          return\n        }\n        guard #available(macOS 13.0, *) else {\n          result(FlutterError(\n            code: \"unsupported_macos\",\n            message: \"Launch at login requires macOS 13 or later.\",\n            details: nil\n          ))\n          return\n        }\n        do {\n          let service = SMAppService.mainApp\n          if enabled {\n            if service.status == .notRegistered || service.status == .notFound {\n              try service.register()\n            }\n          } else if service.status != .notRegistered {\n            try service.unregister()\n          }\n          result(nil)\n        } catch {\n          result(FlutterError(\n            code: \"autostart_failed\",\n            message: error.localizedDescription,\n            details: nil\n          ))\n        }\n      default:\n        result(FlutterMethodNotImplemented)\n      }\n    }\n  }\n}\n\n/// macOS side of the same channel used by the iOS iCloud bridge. Files are\n""",
          )
          PY

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main_desktop.dart lib/src/platform/desktop_shutdown.dart \
            lib/src/platform/desktop_autostart.dart test/desktop_shutdown_test.dart \
            macos/Runner/MainFlutterWindow.swift
          git commit -m "fix: make Flutter desktop quit reliably"
          git push origin HEAD:agent/flutter-desktop-quit-branding
