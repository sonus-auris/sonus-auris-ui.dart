name: DEN-1398 Android crash-scope finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/den-1398-android-crash-scope-finalize.yml

permissions:
  contents: write

concurrency:
  group: den-1398-android-crash-scope-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/den-1398-android-phase-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact phase-evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1398-android-phase-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Package-scope Android fatal evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/device-lab/android-attached-smoke.sh")
          source = script_path.read_text(encoding="utf-8")
          old = '''fatal_crash_in_phase() {
            local phase="${1:?evidence phase is required}"
            grep -Eq "FATAL EXCEPTION|am_crash|Process $PKG .* has died" \\
              "$EVIDENCE_DIR/$phase-crash-focused-logcat.txt"
          }
          '''
          new = '''fatal_crash_in_phase() {
            local phase="${1:?evidence phase is required}"
            local package_regex="${PKG//./\\\\.}"
            grep -Eq \\
              "Process:[[:space:]]*$package_regex([,[:space:]]|$)|am_crash.*$package_regex|Process[[:space:]]+$package_regex([[:space:]]+\\([^)]*\\))?[[:space:]]+has died" \\
              "$EVIDENCE_DIR/$phase-crash-focused-logcat.txt"
          }
          '''
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit("fatal_crash_in_phase block changed unexpectedly")
          script_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/ci/android-phase-evidence.test.py")
          test = test_path.read_text(encoding="utf-8")
          old_imports = '''import re
          import subprocess
          from pathlib import Path
          '''
          new_imports = '''import re
          import shlex
          import subprocess
          import tempfile
          from pathlib import Path
          '''
          if old_imports not in test:
              raise SystemExit("test import block changed unexpectedly")
          test = test.replace(old_imports, new_imports, 1)

          marker = '''
          def main() -> None:
          '''
          helper = '''
          def crash_detected(function_body_text: str, evidence: str) -> bool:
              with tempfile.TemporaryDirectory(prefix="sonus-android-crash-scope-") as temp:
                  root = Path(temp)
                  (root / "test-crash-focused-logcat.txt").write_text(
                      evidence, encoding="utf-8"
                  )
                  script = f"""set -euo pipefail
          PKG=com.ores.sonus_auris
          EVIDENCE_DIR={shlex.quote(str(root))}
          fatal_crash_in_phase() {{
          {function_body_text}
          }}
          fatal_crash_in_phase test
          """
                  return subprocess.run(["bash", "-c", script], check=False).returncode == 0


          def main() -> None:
          '''
          if marker not in test:
              raise SystemExit("test main marker changed unexpectedly")
          test = test.replace(marker, helper, 1)

          old_assertions = '''    fatal = function_body(source, "fatal_crash_in_phase")
              assert 'local phase="${1:?evidence phase is required}"' in fatal
              assert '$EVIDENCE_DIR/$phase-crash-focused-logcat.txt' in fatal
          '''
          new_assertions = '''    fatal = function_body(source, "fatal_crash_in_phase")
              assert 'local phase="${1:?evidence phase is required}"' in fatal
              assert 'local package_regex="${PKG//./\\\\.}"' in fatal
              assert '$EVIDENCE_DIR/$phase-crash-focused-logcat.txt' in fatal
              assert "FATAL EXCEPTION|" not in fatal
              assert "am_crash.*$package_regex" in fatal
              assert "Process:[[:space:]]*$package_regex" in fatal

              unrelated = """AndroidRuntime: FATAL EXCEPTION: main
          AndroidRuntime: Process: com.example.other, PID: 7
          am_crash: [7,0,com.example.other,other]
          """
              assert not crash_detected(fatal, unrelated)
              assert crash_detected(
                  fatal,
                  "AndroidRuntime: Process: com.ores.sonus_auris, PID: 8\\n",
              )
              assert crash_detected(
                  fatal,
                  "am_crash: [8,0,com.ores.sonus_auris,main]\\n",
              )
              assert crash_detected(
                  fatal,
                  "ActivityManager: Process com.ores.sonus_auris (pid 9) has died: fg TOP\\n",
              )
              assert not crash_detected(
                  fatal,
                  "AndroidRuntime: Process: comXoresXsonus_auris, PID: 10\\n",
              )
          '''
          if old_assertions not in test:
              raise SystemExit("fatal detector assertions changed unexpectedly")
          test_path.write_text(test.replace(old_assertions, new_assertions, 1), encoding="utf-8")
          PY

      - name: Validate hardened shell and executable contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/device-lab/android-attached-smoke.sh
          python3 -m py_compile tests/ci/android-phase-evidence.test.py
          python3 tests/ci/android-phase-evidence.test.py
          git diff --check

      - name: Remove helper and push permanent review head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1398-android-crash-scope-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: scope Android fatal evidence to Sonus package'
          git push origin HEAD:agent/den-1398-android-phase-evidence
