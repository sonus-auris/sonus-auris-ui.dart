name: Formal methods

on:
  pull_request:
    paths:
      - '.github/workflows/formal-methods.yml'
      - 'formal/**'
      - 'lib/src/models/recording_segment.dart'
      - 'lib/src/app/app_controller.dart'
      - 'lib/src/services/segment_index.dart'
      - 'lib/src/services/s3_storage_client.dart'
      - 'lib/src/services/sound_recorder_backend_client.dart'
      - 'lib/src/retention/local_retention_policy.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-methods.yml'
      - 'formal/**'
      - 'lib/src/models/recording_segment.dart'
      - 'lib/src/app/app_controller.dart'
      - 'lib/src/services/segment_index.dart'
      - 'lib/src/services/s3_storage_client.dart'
      - 'lib/src/services/sound_recorder_backend_client.dart'
      - 'lib/src/retention/local_retention_policy.dart'
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUINT_PACKAGE: '@informalsystems/quint@0.32.0'

jobs:
  encrypted-segment-lifecycle:
    name: Quint encrypted segment lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check retention journal procedure and crash recovery
        run: python3 formal/retention_journal_model.py

      - name: Replay crash-after-delete JSON-lines witness
        run: |
          printf '%s\n' \
            '{"op":"replay","backed_up":false,"events":["tombstone","delete","crash","recover"]}' \
            | python3 formal/retention_journal_model.py --json-stdin

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Typecheck model and deterministic traces
        run: |
          mkdir -p .formal-artifacts/typecheck
          set -o pipefail
          status=0
          npx --yes --package="$QUINT_PACKAGE" quint typecheck formal/segment_lifecycle.qnt \
            2>&1 | tee .formal-artifacts/typecheck/segment-lifecycle.log || status=$?
          npx --yes --package="$QUINT_PACKAGE" quint typecheck formal/segment_lifecycle_test.qnt \
            2>&1 | tee .formal-artifacts/typecheck/segment-lifecycle-test.log || status=$?
          exit "$status"

      - name: Run deterministic state-machine traces
        run: |
          mkdir -p .formal-artifacts/tests
          set -o pipefail
          npx --yes --package="$QUINT_PACKAGE" quint test \
            formal/segment_lifecycle_test.qnt \
            --main=segment_lifecycle_test \
            --match='.*Test$' \
            --out-itf='.formal-artifacts/tests/{test}-{seq}.itf.json' \
            2>&1 | tee .formal-artifacts/tests/quint-test.log

      - name: Simulate invariants and reach critical states
        run: |
          mkdir -p .formal-artifacts/simulation
          set -o pipefail
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/segment_lifecycle.qnt \
            --main=segment_lifecycle \
            --max-samples=10000 \
            --max-steps=35 \
            --invariant=segment_lifecycle_safety \
            --witnesses \
              direct_upload_reached \
              partial_remote_without_ack_reached \
              retry_generation_reached \
              retention_tombstone_reached \
            2>&1 | tee .formal-artifacts/simulation/quint-run.log

      - name: Generate model-based testing traces
        run: |
          mkdir -p .formal-artifacts/mbt
          set -o pipefail
          npx --yes --package="$QUINT_PACKAGE" quint run \
            formal/segment_lifecycle.qnt \
            --main=segment_lifecycle \
            --max-samples=500 \
            --max-steps=25 \
            --n-traces=8 \
            --mbt \
            --out-itf='.formal-artifacts/mbt/segment-lifecycle-{seq}.itf.json' \
            2>&1 | tee .formal-artifacts/mbt/quint-run.log

      - name: Install Java for bounded verification
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Exhaustively check bounded executions with Apalache
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .formal-artifacts/verify
          set -o pipefail
          npx --yes --package="$QUINT_PACKAGE" quint verify \
            formal/segment_lifecycle.qnt \
            --main=segment_lifecycle \
            --max-steps=12 \
            --invariant=segment_lifecycle_safety \
            --out-itf='.formal-artifacts/verify/counterexample-{seq}.itf.json' \
            2>&1 | tee .formal-artifacts/verify/quint-verify.log

      - name: Record verification inputs
        if: always()
        run: |
          mkdir -p .formal-artifacts
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'node=' && node --version
            printf 'java=' && (java -version 2>&1 | head -n 1 || true)
            printf 'quint_package=%s\n' "$QUINT_PACKAGE"
            printf 'plaintext_retention_hours=100\n'
            sha256sum \
              formal/fm.toml \
              formal/segment_lifecycle.qnt \
              formal/segment_lifecycle_test.qnt \
              formal/retention_journal_model.py \
              formal/RETENTION_PROCEDURE.md
          } > .formal-artifacts/provenance.txt

      - name: Upload traces and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonus-auris-segment-lifecycle-formal-artifacts
          path: .formal-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
