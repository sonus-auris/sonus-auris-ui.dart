name: iOS Simulator log retention

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/device-lab/ios-simulator-smoke.sh
      - scripts/device-lab/evidence-policy.py
      - scripts/device-lab/bounded-log.py
      - tests/ci/ios-simulator-log-retention.test.py
      - .github/workflows/ios-simulator-log-retention.yml
  pull_request:
    paths:
      - scripts/device-lab/ios-simulator-smoke.sh
      - scripts/device-lab/evidence-policy.py
      - scripts/device-lab/bounded-log.py
      - tests/ci/ios-simulator-log-retention.test.py
      - .github/workflows/ios-simulator-log-retention.yml

permissions:
  contents: read

jobs:
  contract:
    name: Streaming redaction and bounded context contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate iOS Simulator log evidence contracts
        run: |
          set -euo pipefail
          bash -n scripts/device-lab/ios-simulator-smoke.sh
          python3 -m py_compile \
            scripts/device-lab/evidence-policy.py \
            scripts/device-lab/bounded-log.py \
            tests/ci/ios-simulator-log-retention.test.py
          python3 scripts/device-lab/evidence-policy.py --self-test
          python3 scripts/device-lab/bounded-log.py --self-test
          python3 tests/ci/ios-simulator-log-retention.test.py
