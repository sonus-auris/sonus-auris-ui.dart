name: e2e

# Browser end-to-end smokes: the SAME node:test assertions run under both
# Puppeteer and Playwright against the real web build. Mirrors the browser
# runners in ~/codes/ores/k8s-cluster (remote/deployments/browser-test-server),
# which back every driver with one bundled Chromium.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: flutter pub get
      - name: Build the web bundle the smokes serve
        run: flutter build web --release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Chromium (shared by both drivers)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Puppeteer + Playwright smokes
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/artifacts/*.png
          retention-days: 7
