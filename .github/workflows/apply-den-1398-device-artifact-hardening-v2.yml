name: Apply DEN-1398 device artifact hardening v2

on:
  pull_request:
    paths:
      - '.github/workflows/apply-den-1398-device-artifact-hardening-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Apply reviewed lifecycle transformations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def blob(path: Path) -> str:
              return subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match, found {count}"
                  )
              return text.replace(old, new, 1)

          android_path = Path("scripts/device-lab/android-attached-smoke.sh")
          android = android_path.read_text(encoding="utf-8")
          if "fatal_crash_in_phase()" not in android:
              expected = "62e2b8ccaf0500b5cb00df3e3b6fe46da07869e7"
              observed = blob(android_path)
              if observed != expected:
                  raise SystemExit(
                      f"refusing drifted Android smoke: expected {expected}, observed {observed}"
                  )
              android = replace_once(
                  android,
                  'capture_crash_evidence() {\n',
                  'capture_crash_evidence() {\n  local phase="${1:?evidence phase is required}"\n',
                  "capture function signature",
              )
              for old, new, label in (
                  (
                      '> "$EVIDENCE_DIR/crash-focused-logcat.txt" || true',
                      '> "$EVIDENCE_DIR/$phase-crash-focused-logcat.txt" || true',
                      "crash log filename",
                  ),
                  (
                      '> "$EVIDENCE_DIR/package-summary.txt" || true',
                      '> "$EVIDENCE_DIR/$phase-package-summary.txt" || true',
                      "package filename",
                  ),
                  (
                      '> "$EVIDENCE_DIR/activity-summary.txt" || true',
                      '> "$EVIDENCE_DIR/$phase-activity-summary.txt" || true',
                      "activity filename",
                  ),
                  (
                      '> "$EVIDENCE_DIR/screenshot.png" 2>/dev/null || true',
                      '> "$EVIDENCE_DIR/$phase-screenshot.png" 2>/dev/null || true',
                      "screenshot filename",
                  ),
              ):
                  android = replace_once(android, old, new, label)
              android = replace_once(
                  android,
                  '  fi\n}\n\nif ! wait_for_process 40; then',
                  '  fi\n}\n\n'
                  'fatal_crash_in_phase() {\n'
                  '  local phase="${1:?evidence phase is required}"\n'
                  '  grep -Eq "FATAL EXCEPTION|am_crash|Process $PKG .* has died" \\\n'
                  '    "$EVIDENCE_DIR/$phase-crash-focused-logcat.txt"\n'
                  '}\n\n'
                  'if ! wait_for_process 40; then',
                  "fatal helper insertion",
              )
              for old, new, label in (
                  (
                      '  collect_ui_summary | tee "$EVIDENCE_DIR/ui-summary.txt" || true\n'
                      '  capture_crash_evidence\n'
                      '  exit 6',
                      '  collect_ui_summary | tee "$EVIDENCE_DIR/ui-summary.txt" || true\n'
                      '  capture_crash_evidence first-launch-failure\n'
                      '  exit 6',
                      "first launch process failure",
                  ),
                  (
                      '  echo "No expected non-sensitive Sonus Auris label was exposed through Android accessibility semantics." >&2\n'
                      '  capture_crash_evidence\n'
                      '  exit 7',
                      '  echo "No expected non-sensitive Sonus Auris label was exposed through Android accessibility semantics." >&2\n'
                      '  capture_crash_evidence first-launch-ui-failure\n'
                      '  exit 7',
                      "first launch UI failure",
                  ),
                  (
                      'capture_crash_evidence\n'
                      'if grep -Eq "FATAL EXCEPTION|am_crash|Process $PKG .* has died" "$EVIDENCE_DIR/crash-focused-logcat.txt"; then\n'
                      '  echo "Fatal Android crash evidence was found after first launch."',
                      'capture_crash_evidence first-launch\n'
                      'if fatal_crash_in_phase first-launch; then\n'
                      '  echo "Fatal Android crash evidence was found after first launch."',
                      "first launch phase",
                  ),
                  (
                      '  echo "App process did not recover after Home/background resume." >&2\n'
                      '  capture_crash_evidence\n'
                      '  exit 9',
                      '  echo "App process did not recover after Home/background resume." >&2\n'
                      '  capture_crash_evidence home-resume-failure\n'
                      '  exit 9',
                      "home resume process failure",
                  ),
                  (
                      'capture_crash_evidence\n'
                      'if grep -Eq "FATAL EXCEPTION|am_crash|Process $PKG .* has died" "$EVIDENCE_DIR/crash-focused-logcat.txt"; then\n'
                      '  echo "Fatal Android crash evidence was found after foreground resume."',
                      'capture_crash_evidence home-resume\n'
                      'if fatal_crash_in_phase home-resume; then\n'
                      '  echo "Fatal Android crash evidence was found after foreground resume."',
                      "home resume phase",
                  ),
                  (
                      '  echo "App process did not recover after cold relaunch." >&2\n'
                      '  capture_crash_evidence\n'
                      '  exit 13',
                      '  echo "App process did not recover after cold relaunch." >&2\n'
                      '  capture_crash_evidence cold-relaunch-failure\n'
                      '  exit 13',
                      "cold relaunch process failure",
                  ),
                  (
                      'capture_crash_evidence\n'
                      'if grep -Eq "FATAL EXCEPTION|am_crash|Process $PKG .* has died" "$EVIDENCE_DIR/crash-focused-logcat.txt"; then\n'
                      '  echo "Fatal Android crash evidence was found after cold relaunch."',
                      'capture_crash_evidence cold-relaunch\n'
                      'if fatal_crash_in_phase cold-relaunch; then\n'
                      '  echo "Fatal Android crash evidence was found after cold relaunch."',
                      "cold relaunch phase",
                  ),
              ):
                  android = replace_once(android, old, new, label)
              android_path.write_text(android, encoding="utf-8")

          ios_path = Path("scripts/device-lab/ios-simulator-smoke.sh")
          ios = ios_path.read_text(encoding="utf-8")
          if 'bounded-log.py" --max-bytes 524288' not in ios:
              expected = "270963b6ddfbda9ad64594c562020f58d78382c3"
              observed = blob(ios_path)
              if observed != expected:
                  raise SystemExit(
                      f"refusing drifted iOS simulator smoke: expected {expected}, observed {observed}"
                  )
              ios = replace_once(
                  ios,
                  '    | tail -n 500 \\\n'
                  '    | sanitize_stream > "$EVIDENCE_DIR/$label-simulator.log" || true',
                  '    | sanitize_stream \\\n'
                  '    | python3 "$ROOT/scripts/device-lab/bounded-log.py" --max-bytes 524288 \\\n'
                  '    > "$EVIDENCE_DIR/$label-simulator.log" || true',
                  "bounded simulator logs",
              )
              ios_path.write_text(ios, encoding="utf-8")
          PY

          bash -n scripts/device-lab/android-attached-smoke.sh
          bash -n scripts/device-lab/ios-simulator-smoke.sh
          python3 scripts/device-lab/bounded-log.py --self-test
          python3 scripts/device-lab/artifact-audit.py --self-test
          python3 tests/ci/evidence-upload-gate.test.py --self-test
          python3 tests/ci/evidence-upload-gate.test.py .github/workflows/device-lab.yml
          python3 tests/ci/device-lab-lifecycle-contract.test.py

      - name: Commit exact script hardening
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/device-lab/android-attached-smoke.sh \
            scripts/device-lab/ios-simulator-smoke.sh
          if git diff --cached --quiet; then
            echo 'Lifecycle scripts are already hardened.'
            exit 0
          fi
          git commit -m 'test: preserve phased evidence and startup logs'
          git push origin HEAD:${{ github.head_ref }}
