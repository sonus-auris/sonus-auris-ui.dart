name: iOS compile, signed IPA, and App Store upload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_ipa:
        description: Build a signed App Store IPA after the compile check
        type: boolean
        required: true
        default: false
      upload_to_app_store:
        description: Validate and upload the signed IPA to App Store Connect for TestFlight processing
        type: boolean
        required: true
        default: false
      build_name:
        description: Public version name (leave blank to use pubspec.yaml)
        type: string
        required: false
      build_number:
        description: Unique App Store build number (blank uses this workflow run number)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ios-compile:
    # in_app_purchase_storekit requires StoreKit APIs from Xcode 16. macos-14's
    # older Xcode caused recent builds to fail on win-back offer symbols.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Toolchain evidence
        run: |
          flutter --version
          xcodebuild -version

      - run: flutter pub get

      - name: Resolve CocoaPods
        working-directory: ios
        run: pod install

      - name: Compile unsigned iPhone release
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=SONUS_BACKEND_BASE_URL=https://ci.invalid
          --dart-define=SONUS_SUPABASE_URL=https://ci.supabase.co
          --dart-define=SONUS_SUPABASE_ANON_KEY=sb_publishable_ci_compile_only

      - name: Validate release helper shell syntax
        run: bash -n scripts/release/ios-build-ipa.sh scripts/release/upload_app_store.sh

  ios-signed-ipa:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.signed_ipa || inputs.upload_to_app_store) && github.ref == 'refs/heads/main' }}
    needs: ios-compile
    runs-on: macos-15
    timeout-minutes: 55
    environment:
      name: mobile-production
    env:
      DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      SONUS_BACKEND_BASE_URL: ${{ secrets.SONUS_BACKEND_BASE_URL }}
      SONUS_SUPABASE_URL: ${{ secrets.SONUS_SUPABASE_URL }}
      SONUS_SUPABASE_ANON_KEY: ${{ secrets.SONUS_SUPABASE_ANON_KEY }}
      SONUS_BUILD_NAME: ${{ inputs.build_name }}
      SONUS_BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Require release configuration and signing material
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=()
          for name in DEVELOPMENT_TEAM SONUS_BACKEND_BASE_URL SONUS_SUPABASE_URL SONUS_SUPABASE_ANON_KEY CERT_B64 CERT_PASSWORD PROFILE_B64 SONUS_BUILD_NUMBER; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::mobile-production is missing: ${missing[*]}"
            exit 1
          fi
          [[ "$SONUS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::build_number must be a positive integer"
            exit 1
          }

      - name: Require App Store Connect API key only when upload is requested
        if: ${{ inputs.upload_to_app_store }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          missing=()
          for name in KEY_ID ISSUER_ID KEY_B64; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::mobile-production is missing App Store upload values: ${missing[*]}"
            exit 1
          fi

      - name: Import ephemeral signing assets
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain_path="$RUNNER_TEMP/sonus-auris-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert_path="$RUNNER_TEMP/sonus-auris-distribution.p12"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_path="$profile_dir/sonus-auris.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          printf '%s' "$CERT_B64" | base64 -D > "$cert_path"
          security import "$cert_path" -k "$keychain_path" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" >/dev/null

          mkdir -p "$profile_dir"
          printf '%s' "$PROFILE_B64" | base64 -D > "$profile_path"
          {
            echo "SIGNING_KEYCHAIN_PATH=$keychain_path"
            echo "SIGNING_CERT_PATH=$cert_path"
            echo "SIGNING_PROFILE_PATH=$profile_path"
          } >> "$GITHUB_ENV"

      - name: Build signed App Store IPA
        run: scripts/release/ios-build-ipa.sh

      - name: Create artifact checksum
        run: |
          cd build/ios/ipa
          shasum -a 256 ./*.ipa > SHA256SUMS

      - name: Upload signed IPA and symbols as workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonus-auris-ios-${{ env.SONUS_BUILD_NUMBER }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/SHA256SUMS
            build/symbols/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload build to App Store Connect
        if: ${{ inputs.upload_to_app_store }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: scripts/release/upload_app_store.sh

      - name: Remove ephemeral signing assets
        if: always()
        run: |
          [[ -z "${SIGNING_KEYCHAIN_PATH:-}" ]] || security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          [[ -z "${SIGNING_CERT_PATH:-}" ]] || rm -f "$SIGNING_CERT_PATH"
          [[ -z "${SIGNING_PROFILE_PATH:-}" ]] || rm -f "$SIGNING_PROFILE_PATH"
