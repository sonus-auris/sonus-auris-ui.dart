name: Diagnose DEN-382 dependency resolution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: den-382-pubget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.head_ref == 'agent/den-382-retention-banner-export'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - name: Capture dependency solver output
        id: pubget
        shell: bash
        run: |
          set +e
          flutter pub get > "$RUNNER_TEMP/pubget.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 "$RUNNER_TEMP/pubget.log"
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: den-382-pubget-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pubget.log
          if-no-files-found: error
          retention-days: 3

      - name: Require successful dependency resolution
        run: test '${{ steps.pubget.outputs.exit_code }}' = 0
