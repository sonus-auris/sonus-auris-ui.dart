name: Apply DEN-382 PR integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: den-382-pr-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-382-retention-banner-export'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - name: Apply exact source integration
        run: python3 tool/apply_den_382.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart \
            lib/src/app/app_controller.dart \
            lib/src/app/app_view_model.dart \
            lib/src/services/local_export_service.dart \
            lib/src/widgets/retention_expiry_banner.dart \
            test/local_export_service_test.dart \
            test/retention_expiry_banner_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run focused export, banner, and retention tests
        run: |
          flutter test \
            test/local_export_service_test.dart \
            test/retention_expiry_banner_test.dart \
            test/local_retention_policy_test.dart

      - name: Commit validated integration
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/main.dart \
            lib/src/app/app_controller.dart \
            lib/src/app/app_view_model.dart \
            lib/src/services/local_export_service.dart \
            lib/src/widgets/retention_expiry_banner.dart \
            test/local_export_service_test.dart \
            test/retention_expiry_banner_test.dart \
            pubspec.lock
          git commit -m 'Integrate retention warning actions into the app'
          git push origin "HEAD:${BRANCH}"
