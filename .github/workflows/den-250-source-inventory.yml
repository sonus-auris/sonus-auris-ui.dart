name: DEN-250 retention ceiling transform

on:
  pull_request:
    paths:
      - '.github/workflows/den-250-source-inventory.yml'
  push:
    branches:
      - agent/den-250-artifact-producer-wiring
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/den-250-artifact-producer-wiring

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.0
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get

      - name: Apply config-boundary ceiling
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/src/models/app_config.dart')
          source = path.read_text()
          marker = 'static const maxDeviceRetentionHours = 100;'
          if marker not in source:
              replacements = [
                  (
                      """  static const defaultSupabaseAnonKey = String.fromEnvironment(
    'SONUS_SUPABASE_ANON_KEY',
  );

""",
                      """  static const defaultSupabaseAnonKey = String.fromEnvironment(
    'SONUS_SUPABASE_ANON_KEY',
  );

  static const minDeviceRetentionHours = 1;
  static const maxDeviceRetentionHours = 100;

  static int normalizeDeviceRetentionHours(int hours) =>
      hours.clamp(minDeviceRetentionHours, maxDeviceRetentionHours).toInt();

""",
                      'retention constants',
                  ),
                  (
                      '    this.deviceRetentionHours = 100,\n',
                      '    int deviceRetentionHours = maxDeviceRetentionHours,\n',
                      'constructor parameter',
                  ),
                  (
                      '  }) : _recordingSchedule = recordingSchedule;\n',
                      '  }) : _deviceRetentionHours = deviceRetentionHours,\n       _recordingSchedule = recordingSchedule;\n',
                      'constructor initializer',
                  ),
                  (
                      '  final int deviceRetentionHours;\n  final int cloudRetentionHours;\n',
                      """  final int _deviceRetentionHours;

  /// The effective local plaintext lifetime. Legacy, remote, and directly
  /// constructed oversized values are normalized at the model boundary so no
  /// deletion, sync, estimate, or UI caller can bypass the 100-hour ceiling.
  int get deviceRetentionHours =>
      normalizeDeviceRetentionHours(_deviceRetentionHours);

  final int cloudRetentionHours;
""",
                      'normalized getter',
                  ),
              ]
              for old, new, label in replacements:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected one match, found {count}')
                  source = source.replace(old, new, 1)
              path.write_text(source)

          test = Path('test/device_retention_ceiling_test.dart')
          if not test.exists():
              test.write_text("""import 'package:audio_dashcam/src/models/app_config.dart';
import 'package:flutter_test/flutter_test.dart';

void main() {
  test('direct oversized values cannot bypass the model ceiling', () {
    const config = AppConfig(deviceId: 'device', deviceRetentionHours: 500);
    expect(config.deviceRetentionHours, AppConfig.maxDeviceRetentionHours);
  });

  test('legacy persisted oversized values migrate on read and write', () {
    final config = AppConfig.fromJson({
      'deviceId': 'device',
      'deviceRetentionHours': 500,
    });
    expect(config.deviceRetentionHours, 100);
    expect(config.toJson()['deviceRetentionHours'], 100);
  });

  test('shorter values and the minimum remain supported', () {
    expect(
      const AppConfig(deviceId: 'd', deviceRetentionHours: 24)
          .deviceRetentionHours,
      24,
    );
    expect(
      const AppConfig(deviceId: 'd', deviceRetentionHours: 0)
          .deviceRetentionHours,
      1,
    );
  });
}
""")
          PY

      - name: Format, analyze, and test
        run: |
          set -euo pipefail
          dart format lib/src/models/app_config.dart test/device_retention_ceiling_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/device_retention_ceiling_test.dart
          flutter test test/segment_index_retention_test.dart

      - name: Commit validated source
        run: |
          set -euo pipefail
          git add lib/src/models/app_config.dart test/device_retention_ceiling_test.dart
          if git diff --cached --quiet; then
            echo 'Validated source is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'DEN-250 enforce the 100-hour config boundary'
          git push origin HEAD:agent/den-250-artifact-producer-wiring
