name: Finalize Flutter desktop fix

on:
  push:
    branches:
      - agent/flutter-desktop-quit-branding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/flutter-desktop-quit-branding
          persist-credentials: true

      - name: Apply final desktop lifecycle changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/main_desktop.dart",
              """  await windowManager.ensureInitialized();
  runApp(const SonusDesktopApp());
""",
              """  await windowManager.ensureInitialized();
  await DesktopAutostart.setup();
  runApp(const SonusDesktopApp());
""",
          )
          replace_once(
              "lib/main_desktop.dart",
              """    WidgetsBinding.instance.addObserver(this);
    DesktopAutostart.setup();
    _controller = AppController();
""",
              """    WidgetsBinding.instance.addObserver(this);
    _controller = AppController();
""",
          )

          autostart = Path("lib/src/platform/desktop_autostart.dart")
          text = autostart.read_text()
          old = """  /// Wires the cross-platform package on Windows/Linux. macOS uses the native
  /// ServiceManagement bridge, which needs no executable path.
  static void setup() {
    if (!(Platform.isWindows || Platform.isLinux)) return;
    launchAtStartup.setup(
      appName: 'Sonus Auris',
      appPath: Platform.resolvedExecutable,
    );
  }
"""
          new = """  /// Wires the legacy cross-platform package, then removes any old macOS
  /// LaunchAgent that may point at a Terminal/debug executable. Packaged macOS
  /// startup is re-registered later through `SMAppService.mainApp`.
  static Future<void> setup() async {
    if (!isSupported) return;
    launchAtStartup.setup(
      appName: 'Sonus Auris',
      appPath: Platform.resolvedExecutable,
    );
    if (Platform.isMacOS) {
      try {
        await launchAtStartup.disable();
      } catch (_) {
        // Migration cleanup is best-effort. The native bundle registration is
        // still authoritative for packaged release builds.
      }
    }
  }
"""
          if old not in text:
              raise SystemExit("expected DesktopAutostart.setup block not found")
          autostart.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/desktop-build.yml")
          text = workflow.read_text()
          expression = "$" + "{{ github.event_name != 'pull_request' }}"
          old = f"  macos:\n    if: {expression}\n    runs-on: macos-15\n"
          new = "  macos:\n    runs-on: macos-15\n"
          if old not in text:
              raise SystemExit("expected macOS PR condition not found")
          workflow.write_text(text.replace(old, new, 1))

          readme = Path("README.md")
          marker = """## Desktop builds (macOS / Windows / Linux)

"""
          note = """## Desktop builds (macOS / Windows / Linux)

On macOS, `flutter run` is a debug process launched by the invoking development
tool and macOS may attribute its first microphone prompt to Terminal. Validate
production permission branding by building and opening the packaged `Sonus
Auris.app`. Launch-at-login is registered only by packaged release builds via
`SMAppService.mainApp`; startup also removes the legacy debug LaunchAgent used by
older builds.

"""
          text = readme.read_text()
          if marker not in text:
              raise SystemExit("desktop README heading not found")
          readme.write_text(text.replace(marker, note, 1))
          PY

      - name: Commit final patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-finalize-desktop-fix.yml
          git add lib/main_desktop.dart lib/src/platform/desktop_autostart.dart \
            .github/workflows/desktop-build.yml README.md
          git commit -m "fix: migrate macOS startup to the app bundle"
          git push origin HEAD:agent/flutter-desktop-quit-branding
