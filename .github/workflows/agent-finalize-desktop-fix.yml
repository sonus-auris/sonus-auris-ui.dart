name: Finalize Flutter desktop fix

on:
  push:
    branches:
      - agent/flutter-desktop-quit-branding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/flutter-desktop-quit-branding
          persist-credentials: true

      - name: Apply final desktop lifecycle changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/main_desktop.dart",
              """  await windowManager.ensureInitialized();\n  runApp(const SonusDesktopApp());\n""",
              """  await windowManager.ensureInitialized();\n  await DesktopAutostart.setup();\n  runApp(const SonusDesktopApp());\n""",
          )
          replace_once(
              "lib/main_desktop.dart",
              """    WidgetsBinding.instance.addObserver(this);\n    DesktopAutostart.setup();\n    _controller = AppController();\n""",
              """    WidgetsBinding.instance.addObserver(this);\n    _controller = AppController();\n""",
          )

          autostart = Path("lib/src/platform/desktop_autostart.dart")
          text = autostart.read_text()
          old = """  /// Wires the cross-platform package on Windows/Linux. macOS uses the native\n  /// ServiceManagement bridge, which needs no executable path.\n  static void setup() {\n    if (!(Platform.isWindows || Platform.isLinux)) return;\n    launchAtStartup.setup(\n      appName: 'Sonus Auris',\n      appPath: Platform.resolvedExecutable,\n    );\n  }\n"""
          new = """  /// Wires the legacy cross-platform package, then removes any old macOS\n  /// LaunchAgent that may point at a Terminal/debug executable. Packaged macOS\n  /// startup is re-registered later through `SMAppService.mainApp`.\n  static Future<void> setup() async {\n    if (!isSupported) return;\n    launchAtStartup.setup(\n      appName: 'Sonus Auris',\n      appPath: Platform.resolvedExecutable,\n    );\n    if (Platform.isMacOS) {\n      try {\n        await launchAtStartup.disable();\n      } catch (_) {\n        // Migration cleanup is best-effort. The native bundle registration is\n        // still authoritative for packaged release builds.\n      }\n    }\n  }\n"""
          if old not in text:
              raise SystemExit("expected DesktopAutostart.setup block not found")
          autostart.write_text(text.replace(old, new, 1))

          replace_once(
              ".github/workflows/desktop-build.yml",
              """  macos:\n    if: ${{ github.event_name != 'pull_request' }}\n    runs-on: macos-15\n""",
              """  macos:\n    runs-on: macos-15\n""",
          )

          readme = Path("README.md")
          marker = """## Desktop builds (macOS / Windows / Linux)\n\n"""
          note = """## Desktop builds (macOS / Windows / Linux)\n\nOn macOS, `flutter run` is a debug process launched by the invoking development\ntool and macOS may attribute its first microphone prompt to Terminal. Validate\nproduction permission branding by building and opening the packaged `Sonus\nAuris.app`. Launch-at-login is registered only by packaged release builds via\n`SMAppService.mainApp`; startup also removes the legacy debug LaunchAgent used by\nolder builds.\n\n"""
          text = readme.read_text()
          if marker not in text:
              raise SystemExit("desktop README heading not found")
          readme.write_text(text.replace(marker, note, 1))
          PY

      - name: Commit final patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-finalize-desktop-fix.yml
          git add lib/main_desktop.dart lib/src/platform/desktop_autostart.dart \
            .github/workflows/desktop-build.yml README.md
          git commit -m "fix: migrate macOS startup to the app bundle"
          git push origin HEAD:agent/flutter-desktop-quit-branding
